[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fastmark"
version = "0.1.0"
description = "Model-free, single-kernel, pre-encode luma video watermark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The CUDA embedder compiles with the libnvrtc that torch ships.
cuda = ["torch>=2.4"]
# The blind detector runs on CPU.
detect = ["scipy>=1.10"]
test = ["pytest>=8", "opencv-python-headless>=4.8", "scipy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/fastmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
